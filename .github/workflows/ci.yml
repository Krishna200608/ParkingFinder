name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Start MongoDB Replica Set
        run: |
          docker run -d --name mongodb -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          until docker exec mongodb mongosh --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok || rs.status().ok" > /dev/null 2>&1; do
            echo "Waiting for MongoDB replica set to initialize..."
            sleep 1
          done
          echo "MongoDB replica set initialized successfully!"

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Style (ESLint)
        run: npm run lint

      - name: Run Test Suites (Vitest)
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/parkingfinder_ci?directConnection=true
          JWT_SECRET: ci_secret_key_testing_12345
          NODE_ENV: test
        run: npm test

      - name: Verify Production Build
        run: npm run build
