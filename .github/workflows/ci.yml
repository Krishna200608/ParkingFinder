name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Lint, Test & Production Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Style (ESLint)
        run: npm run lint

      - name: Run Test Suites (Vitest)
        env:
          MONGO_URI: mongodb://localhost:27017/parkingfinder_ci
          JWT_SECRET: ci_secret_key_testing_12345
          NODE_ENV: test
        run: npm test

      - name: Verify Production Build
        run: npm run build
